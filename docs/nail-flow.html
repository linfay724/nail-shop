<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穿戴甲小程序 · 页面流程图</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#eef1f5; color:#222; padding:26px 16px 50px;
  }
  h1 { text-align:center; font-size:22px; margin-bottom:4px; }
  .sub { text-align:center; color:#888; font-size:12px; margin-bottom:18px; }

  .legend {
    max-width:1180px; margin:0 auto 18px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    font-size:12px; color:#555;
  }
  .legend span { background:#fff; border:1px solid #dde3ea; border-radius:20px; padding:5px 12px; display:flex; align-items:center; gap:6px;}
  .dot { display:inline-block; width:10px; height:10px; border-radius:3px; }
  .dot.pub{background:#e7f7ee;border:1.5px solid #2fb36a;}
  .dot.own{background:#fdf3e2;border:1.5px solid #e8a13a;}
  .dot.art{background:#efedfd;border:1.5px solid #7c6cf0;}
  .dot.no{background:#fdeaea;border:1.5px solid #e05555;}
  .dot.dec{background:#fff;border:1.5px solid #889;transform:rotate(45deg);}

  .canvas-wrap {
    max-width:1180px; margin:0 auto; background:#fff; border-radius:16px;
    box-shadow:0 8px 28px rgba(0,0,0,.08); padding:20px; overflow-x:auto;
  }
  svg { display:block; margin:0 auto; min-width:1000px; }

  /* 节点样式 */
  .node rect { stroke-width:1.6; rx:10; ry:10; transition:.15s; cursor:default;}
  .node text { font-size:12px; font-weight:600; fill:#334; pointer-events:none;}
  .node .role { font-size:9px; font-weight:400; fill:#889;}
  .node.pub rect { fill:#f1fbf5; stroke:#2fb36a; }
  .node.own rect { fill:#fdf8ee; stroke:#e8a13a; }
  .node.art rect { fill:#f5f3ff; stroke:#7c6cf0; }
  .node.no rect { fill:#fdf0f0; stroke:#e05555; }
  .node.dec rect { fill:#f4f6f8; stroke:#889; }

  .edge { stroke:#b9c2cd; stroke-width:1.6; fill:none; transition:.15s;}
  .edge.dash { stroke-dasharray:5 4; }
  .edge.priv { stroke:#e8a13a; stroke-dasharray:6 4; }
  .edge.deny { stroke:#e05555; stroke-dasharray:4 4; }
  .elabel { font-size:9.5px; fill:#889; }
  .elabel.warn { fill:#e05555; }
  .elabel.priv { fill:#c07a10; }

  .node:hover rect { filter:drop-shadow(0 3px 8px rgba(0,0,0,.12)); }
  .hl .edge { stroke:#2fb36a; stroke-width:2.4; opacity:1;}
  .dim .edge { opacity:.18; }
  .dim .node { opacity:.28; }
  .dim .node.hl-node { opacity:1; }
  .dim .node.hl-node rect { filter:drop-shadow(0 3px 10px rgba(47,179,106,.35)); }

  .zone-label { font-size:11px; fill:#aab; font-weight:600; letter-spacing:1px;}
  .zone-line { stroke:#e3e8ee; stroke-width:1.5; stroke-dasharray:6 5; }

  .tip { text-align:center; font-size:11px; color:#99a; margin-top:14px; }
</style>
</head>
<body>

<h1>穿戴甲小程序 · 页面流程图</h1>
<p class="sub">悬停节点可高亮其关联连线 ｜ 虚线=权限分流，橙虚线=私有字段，红虚线=拒绝访问</p>

<div class="legend">
  <span><i class="dot pub"></i>公开页（所有用户）</span>
  <span><i class="dot own"></i>店主专属</span>
  <span><i class="dot art"></i>美甲师可读</span>
  <span><i class="dot no"></i>禁止 / 不下发</span>
  <span><i class="dot dec"></i>决策节点</span>
</div>

<div class="canvas-wrap">

  <defs>

      <path d="M0,0 L7,3.5 L0,7 Z" fill="#b9c2cd"/>
    </marker>
    <marker id="arrowWarn" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#e05555"/>
    </marker>

<p class="tip">共 21 个节点 · 用户端 11 / 管理端 10 · 红虚线代表权限边界，橙虚线代表私有数据流</p>

<script>
/* 悬停高亮：节点 → 关联边 + 对端节点 */
const svg = document.getElementById("flow");
const nodes = [...svg.querySelectorAll(".node")];
const edges = [...svg.querySelectorAll(".edge")];

function idOf(g){ return g.getAttribute("data-id"); }

nodes.forEach(g=>{
  const id = idOf(g);
  g.addEventListener("mouseenter", ()=>{
    svg.classList.add("dim");
    const related = new Set([id]);
    edges.forEach(e=>{
      if(e.getAttribute("data-from")===id || e.getAttribute("data-to")===id){
        e.style.strokeWidth="2.4";
        e.style.opacity="1";
        related.add(e.getAttribute("data-from"));
        related.add(e.getAttribute("data-to"));
      } else {
        e.style.opacity=".12";
      }
    });
    nodes.forEach(n=>{
      if(related.has(idOf(n))) n.classList.add("hl-node");
    });
    g.classList.add("hl-node");
  });
  g.addEventListener("mouseleave", ()=>{
    svg.classList.remove("dim");
    edges.forEach(e=>{ e.style.strokeWidth=""; e.style.opacity=""; });
    nodes.forEach(n=>n.classList.remove("hl-node"));
  });
});
</script>

</body>
</html>
