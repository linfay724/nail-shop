<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穿戴甲小程序 · 交互原型 v1.1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:#eef1f5; color:#222; padding:24px 16px 40px;
  }
  h1 { text-align:center; font-size:22px; margin-bottom:4px; }
  .sub { text-align:center; color:#888; font-size:12px; margin-bottom:18px; }

  /* 顶部导航 */
  .nav {
    position:sticky; top:0; z-index:50; background:#eef1f5cc; backdrop-filter:blur(8px);
    padding:8px 0 12px; margin-bottom:16px;
  }
  .nav-inner { max-width:1240px; margin:0 auto; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .nav button {
    font-size:11px; padding:6px 11px; border-radius:16px; border:1px solid #d6dde6;
    background:#fff; color:#445; cursor:pointer; transition:.15s;
  }
  .nav button:hover { border-color:#2fb36a; color:#2fb36a; }
  .nav button.on { background:#2fb36a; color:#fff; border-color:#2fb36a; }
  .nav button.admin.on { background:#7c6cf0; border-color:#7c6cf0; }

  .stage { max-width:1240px; margin:0 auto; display:flex; gap:30px; justify-content:center; flex-wrap:wrap; align-items:flex-start; }

  /* 手机外框 */
  .phone {
    width:300px; height:600px; background:#fff; border-radius:34px;
    border:9px solid #1c1f26; box-shadow:0 14px 34px rgba(0,0,0,.18);
    position:relative; overflow:hidden; display:flex; flex-direction:column; flex:0 0 auto;
  }
  .statusbar {
    height:26px; display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; font-size:10px; color:#333; flex:0 0 auto; background:#fff;
  }
  .navbar {
    height:40px; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600; border-bottom:1px solid #f0f2f5; flex:0 0 auto; background:#fff; position:relative;
  }
  .navbar .back { position:absolute; left:14px; font-size:18px; color:#555; cursor:pointer; padding:0 4px;}
  .body { flex:1; overflow-y:auto; background:#f7f8fa; }
  .body::-webkit-scrollbar { width:0; }

  .pad { padding:12px; }
  .card { background:#fff; border-radius:12px; padding:12px; margin-bottom:10px; }
  .row { display:flex; align-items:center; }
  .between { justify-content:space-between; }
  .thumb { width:100%; height:130px; border-radius:10px; background:linear-gradient(135deg,#f6d5e0,#e8c7f0); display:flex; align-items:center; justify-content:center; color:#b07; font-size:11px; margin-bottom:8px;}
  .thumb.sm { width:60px; height:60px; margin:0 10px 0 0; flex:0 0 auto; font-size:9px;}
  .tag { font-size:10px; padding:2px 8px; border-radius:10px; background:#fdeef3; color:#d1467e; margin-right:5px;}
  .tag.gray{background:#eef1f5;color:#778;}
  .tag.click { cursor:pointer; }
  .price { color:#e0392b; font-weight:700; font-size:15px; }
  .price small { font-size:10px; font-weight:400;}
  .btn { display:block; text-align:center; background:#2fb36a; color:#fff; border-radius:20px; padding:10px; font-size:13px; font-weight:600; margin-top:8px; cursor:pointer; transition:.15s;}
  .btn:hover { opacity:.9; }
  .btn.outline { background:#fff; color:#2fb36a; border:1px solid #2fb36a;}
  .btn.admin { background:#7c6cf0; }
  .btn.warn { background:#e8a13a; }
  .btn.dis { background:#c9ced6; cursor:not-allowed;}
  .input { background:#f2f4f7; border-radius:8px; padding:9px 10px; font-size:12px; color:#99a; margin-bottom:8px;}
  .input.filled { color:#333; }
  .searchbar { background:#f2f4f7; border-radius:16px; padding:9px 12px; font-size:12px; color:#99a; display:flex; align-items:center;}
  .cat { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .cat span { font-size:11px; background:#fff; border:1px solid #eceff3; border-radius:14px; padding:5px 11px; color:#556; cursor:pointer;}
  .cat span.active { background:#2fb36a; color:#fff; border-color:#2fb36a;}
  .tabbar { height:48px; background:#fff; border-top:1px solid #f0f2f5; display:flex; flex:0 0 auto;}
  .tabbar div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:9px; color:#aab; cursor:pointer;}
  .tabbar div.on { color:#2fb36a; }
  .tabbar .ico { font-size:15px; margin-bottom:1px;}
  .section-h { font-size:12px; font-weight:600; margin:2px 0 8px; color:#334;}
  .muted { color:#99a; font-size:11px;}
  .divider { height:1px; background:#f0f2f5; margin:9px 0;}
  .avatar { width:34px;height:34px;border-radius:50%;background:#e8c7f0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#7c3aed;margin-right:10px;flex:0 0 auto;}
  .cell { display:flex; align-items:center; justify-content:space-between; padding:11px 0; font-size:12px; border-bottom:1px solid #f4f6f8; cursor:pointer;}
  .cell:last-child { border-bottom:none;}
  .cell .r { color:#aab; font-size:11px;}
  .badge { font-size:9px; padding:1px 6px; border-radius:8px; margin-left:5px;}
  .badge.pub{background:#e7f7ee;color:#2fb36a;}
  .badge.own{background:#fdf3e2;color:#e8a13a;}
  .badge.art{background:#efedfd;color:#7c6cf0;}
  .badge.no{background:#fdeaea;color:#e05555;}
  .sku { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px;}
  .sku b { font-size:11px; font-weight:500; border:1px solid #e3e8ee; border-radius:8px; padding:5px 10px; color:#556; cursor:pointer;}
  .sku b.on { border-color:#2fb36a; color:#2fb36a; background:#f1fbf5;}
  .sku b.other { border-style:dashed; color:#e8a13a;}
  .note { background:#fff8ec; border:1px dashed #e8a13a; border-radius:8px; padding:8px; font-size:11px; color:#a76; margin-top:8px;}
  .footerbar { background:#fff; padding:10px 12px; display:flex; gap:8px; align-items:center; flex:0 0 auto; border-top:1px solid #f0f2f5;}
  .footerbar .btn { flex:1; margin-top:0; }
  .stat { display:flex; gap:8px; }
  .stat div { flex:1; background:#fff; border-radius:10px; padding:10px 8px; text-align:center;}
  .stat b { display:block; font-size:16px; color:#334;}
  .stat small { font-size:9px; color:#99a;}
  .stepitem { display:flex; margin-bottom:10px;}
  .stepno { width:20px;height:20px;border-radius:50%;background:#7c6cf0;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;margin-right:8px;flex:0 0 auto;}
  .stepimg { display:flex; gap:4px; margin-top:5px;}
  .stepimg i { width:40px;height:40px;background:#eef1f5;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:8px;color:#99a;font-style:normal;}
  .stepimg i.vid{background:#efedfd;color:#7c6cf0;}
  .perm-note { font-size:9px; color:#e05555; background:#fdeaea; border-radius:6px; padding:6px 8px; margin-top:6px; line-height:1.5;}
  .role-banner { background:#efedfd; color:#5b4bd6; font-size:10px; padding:7px 10px; border-radius:8px; margin-bottom:8px;}
  .checkbox { width:16px;height:16px;border:1.5px solid #2fb36a;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#2fb36a;margin-right:9px;flex:0 0 auto;}
  .stepper { display:flex; align-items:center; gap:0; }
  .stepper span { width:22px;height:22px;border:1px solid #e3e8ee;display:flex;align-items:center;justify-content:center;font-size:13px;color:#667;cursor:pointer;border-radius:5px;}
  .stepper em { font-style:normal; padding:0 9px; font-size:12px; }
  .timeline { position:relative; padding-left:16px; }
  .timeline::before { content:""; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:#e3e8ee; }
  .tl-item { position:relative; margin-bottom:12px; font-size:11px; }
  .tl-item::before { content:""; position:absolute; left:-15px; top:3px; width:8px;height:8px;border-radius:50%;background:#2fb36a; }
  .tl-item.pending::before { background:#c9ced6; }
  .tl-item b { display:block; font-size:11px; color:#334; }
  .radio { width:16px;height:16px;border-radius:50%;border:1.5px solid #c9ced6;margin-right:9px;flex:0 0 auto;}
  .radio.on { border:5px solid #2fb36a; }
</style>
</head>

/* ================== 渲染逻辑 ================== */
const NAV_ORDER = [
  ["home","首页"],["list","搜索列表"],["detail","商品详情"],["cart","购物车"],
  ["order","确认订单"],["orders","我的订单"],["orderDetail","订单详情"],["afterSale","售后协商"],
  ["user","我的"],["adminLogin","管理登录"],["adminHome","管理后台"],["archiveEdit","档案编辑"],
  ["archiveRead","档案只读"],["adminAccounts","账号与码"],["adminOrders","订单管理"],["adminReview","评价规则"]
];

let current = "home";
const stage = document.getElementById("stage");
const navBar = document.getElementById("navBar");

function isAdminPage(key){ return key.startsWith("admin") || key==="archiveEdit" || key==="archiveRead"; }

function renderNav(){
  navBar.innerHTML = NAV_ORDER.map(([k,label])=>{
    const cls = (k===current?"on ":"") + (isAdminPage(k)?"admin":"");
    return `<button class="${cls}" onclick="go('${k}')">${label}</button>`;
  }).join("");
}

function renderTabs(tab, on){
  if(!tab) return "";
  const icons=["⌂","▤","🛒","☺"], names=["首页","分类","购物车","我的"];
  return `<div class="tabbar">` + tab.map((_,i)=>{
    const onCls = i===on?"on":"";
    const target = ["home","list","cart","user"][i];
    return `<div class="${onCls}" onclick="go('${target}')"><span class="ico">${icons[i]}</span>${names[i]}</div>`;
  }).join("") + `</div>`;
}

function render(){
  const p = PAGES[current];
  if(!p) return;
  const tabOn = p.tabOn !== undefined ? p.tabOn : -1;
  stage.innerHTML = `
    <div class="phone">
      <div class="statusbar"><span>9:41</span><span>●●● ⚡</span></div>
      <div class="navbar">
        ${p.role==="管理端"?'<span class="back" onclick="go(\'adminHome\')">‹</span>':''}
        ${p.title}
      </div>
      <div class="body">${p.html}</div>
      ${p.footer?`<div class="footerbar">${p.footer}</div>`:""}
      ${p.tab?renderTabs(p.tab, tabOn):""}
    </div>
  `;
  renderNav();
}

function go(key){
  if(!PAGES[key]) return;
  current = key;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* 初始化 */
render();
