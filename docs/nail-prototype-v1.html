<!--
CSS 变量清单：
品牌色：--primary、--primary-hover、--berry、--admin-accent
页面/组件背景：--page-bg、--surface-bg、--admin-bg、--admin-glass、--white、--input-bg、--admin-soft
文字/边框：--text-primary、--text-secondary、--text-muted、--border、--border-soft、--phone-frame
状态色：--success、--success-bg、--success-soft、--warning、--warning-text、--warning-bg、--warning-bg-soft、--danger-bg、--disabled-bg
占位图色：--tag-bg、--thumb-blush-1、--thumb-blush-2、--thumb-lilac、--thumb-lavender-1、--thumb-lavender-2、--thumb-warm-1
阴影：--card-shadow、--phone-shadow；导航背景：--nav-glass；灰色标签背景：--tag-gray-bg
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穿戴甲小程序 · 交互原型 v1.1</title>
<style>
  :root {
    /* 品牌与基础色 */
    --primary: #E8B4B8;
    --primary-hover: #D49A9E;
    --berry: #8C3B4A;
    --admin-accent: #7C6CF0;

    /* 页面与组件背景 */
    --page-bg: #FAF7F5;
    --surface-bg: #FAF7F5;
    --admin-bg: #F5F4F3;
    --admin-glass: rgba(245, 244, 243, .88);
    --nav-glass: rgba(250, 247, 245, .90);
    --tag-gray-bg: #F4F1F0;
    --white: #FFFFFF;
    --input-bg: #F7F3F2;
    --admin-soft: #F0EDFF;

    /* 文字与边框 */
    --text-primary: #3A3335;
    --text-secondary: #756B6D;
    --text-muted: #9A8F91;
    --border: #F0EAE8;
    --border-soft: #F5F0EE;
    --phone-frame: #3A3335;

    /* 状态色 */
    --success: #5B8C6E;
    --success-bg: #EEF5F0;
    --success-soft: #F4F8F5;
    --warning: #C08A3E;
    --warning-text: #9C713A;
    --warning-bg: #FBF4E9;
    --warning-bg-soft: #FDF8F0;
    --danger-bg: #FAEEEE;
    --disabled-bg: #D8D2D1;

    /* 标签与图片占位色 */
    --tag-bg: #FDF3F4;
    --thumb-blush-1: #F4DDE0;
    --thumb-blush-2: #EBCFD2;
    --thumb-lilac: #E8DFEB;
    --thumb-lavender-1: #E2E5F0;
    --thumb-lavender-2: #D6D9E9;
    --thumb-warm-1: #F2E4DC;

    /* 阴影 */
    --card-shadow: 0 2px 8px rgba(140, 59, 74, .06);
    --phone-shadow: 0 12px 30px rgba(58, 51, 53, .12);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:-apple-system, "PingFang SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
    background:var(--page-bg);
    color:var(--text-primary);
    padding:24px 14px 40px;
    font-size:12px;
    font-weight:400;
    line-height:1.6;
  }
  h1 { text-align:center; font-size:20px; font-weight:600; margin-bottom:4px; color:var(--text-primary); }
  .sub { text-align:center; color:var(--text-muted); font-size:11px; margin-bottom:18px; }

  /* 顶部导航 */
  .nav {
    position:sticky; top:0; z-index:50;
    background:var(--nav-glass);
    backdrop-filter:blur(10px);
    padding:8px 0 12px; margin-bottom:16px;
  }
  .nav-inner { max-width:1240px; margin:0 auto; display:flex; gap:7px; flex-wrap:wrap; justify-content:center; }
  .nav button {
    font-family:inherit;
    font-size:11px; font-weight:500;
    padding:6px 12px; border-radius:999px;
    border:1px solid var(--border);
    background:var(--white); color:var(--text-secondary);
    cursor:pointer; transition:.18s ease;
  }
  .nav button:hover { border-color:var(--primary-hover); color:var(--berry); }
  .nav button.on { background:var(--berry); color:var(--white); border-color:var(--berry); }
  .nav button.admin.on { background:var(--admin-accent); border-color:var(--admin-accent); }

  .stage { max-width:1240px; margin:0 auto; display:flex; gap:30px; justify-content:center; flex-wrap:wrap; align-items:flex-start; }

  /* 手机外框：尺寸与布局保持原样 */
  .phone {
    width:300px; height:600px; background:var(--white); border-radius:34px;
    border:9px solid var(--phone-frame);
    box-shadow:var(--phone-shadow);
    position:relative; overflow:hidden; display:flex; flex-direction:column; flex:0 0 auto;
  }
  .statusbar {
    height:26px; display:flex; align-items:center; justify-content:space-between;
    padding:0 16px; font-size:10px; color:var(--text-primary);
    flex:0 0 auto; background:var(--white);
  }
  .navbar {
    height:40px; display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:600; color:var(--text-primary);
    border-bottom:1px solid var(--border); flex:0 0 auto;
    background:var(--white); position:relative;
  }
  .navbar .back { position:absolute; left:14px; font-size:20px; color:var(--text-secondary); cursor:pointer; padding:0 4px; }
  .body { flex:1; overflow-y:auto; background:var(--surface-bg); }
  .body::-webkit-scrollbar { width:0; }
  body:has(.nav button.admin.on) .phone .body { background:var(--admin-bg); }

  .pad { padding:14px; }
  .card {
    background:var(--white); border:1px solid var(--border);
    border-radius:14px; padding:14px; margin-bottom:10px;
    box-shadow:var(--card-shadow);
  }
  .row { display:flex; align-items:center; }
  .between { justify-content:space-between; }
  .thumb {
    width:100%; height:130px; border-radius:10px;
    background:linear-gradient(135deg,var(--thumb-blush-1),var(--thumb-lilac));
    display:flex; align-items:center; justify-content:center;
    color:var(--berry); font-size:11px; margin-bottom:8px;
  }
  .thumb.sm { width:60px; height:60px; margin:0 10px 0 0; flex:0 0 auto; font-size:9px; }
  .tag {
    font-size:10px; padding:3px 9px; border-radius:999px;
    background:var(--tag-bg); color:var(--berry); margin-right:5px;
  }
  .tag.gray { background:var(--tag-gray-bg); color:var(--text-muted); }
  .tag.click { cursor:pointer; }
  .price { color:var(--berry); font-weight:700; font-size:15px; }
  .price small { font-size:10px; font-weight:400; color:var(--text-muted); }
  .btn {
    display:block; text-align:center; background:var(--berry); color:var(--white);
    border-radius:999px; padding:10px 14px; font-size:13px; font-weight:600;
    margin-top:8px; cursor:pointer; transition:.18s ease;
  }
  .btn:hover { opacity:.9; }
  .btn.outline { background:var(--white); color:var(--berry); border:1px solid var(--primary); }
  .btn.admin { background:var(--admin-accent); }
  .btn.warn { background:var(--warning); }
  .btn.dis { background:var(--disabled-bg); color:var(--white); cursor:not-allowed; }
  .input {
    background:var(--input-bg); border:1px solid var(--border);
    border-radius:10px; padding:9px 10px; font-size:12px;
    color:var(--text-muted); margin-bottom:8px;
  }
  .input.filled { color:var(--text-primary); }
  .searchbar {
    background:var(--white); border:1px solid var(--border);
    border-radius:999px; padding:9px 12px; font-size:12px;
    color:var(--text-muted); display:flex; align-items:center;
  }
  .cat { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .cat.cat-scroll {
    flex-wrap:nowrap;
    overflow-x:auto;
    overflow-y:hidden;
    white-space:nowrap;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
    scrollbar-width:none;
    touch-action:pan-x;
    padding-bottom:3px;
  }
  .cat.cat-scroll::-webkit-scrollbar { display:none; }
  .cat.cat-scroll span { flex:0 0 auto; }
  .cat span {
    font-size:11px; background:var(--white); border:1px solid var(--border);
    border-radius:999px; padding:5px 11px; color:var(--text-secondary); cursor:pointer;
  }
  .cat span.active { background:var(--berry); color:var(--white); border-color:var(--berry); }
  .tabbar { height:48px; background:var(--white); border-top:1px solid var(--border); display:flex; flex:0 0 auto; }
  .tabbar div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:9px; color:var(--text-muted); cursor:pointer; }
  .tabbar div.on { color:var(--berry); }
  .tabbar .ico { font-size:15px; margin-bottom:1px; }

  /* 首页专属展示：不增加搜索框或分类入口 */
  .home-page { padding:12px 13px 16px; }
  .home-intro { padding:1px 2px 11px; }
  .home-kicker { color:var(--berry); font-size:8px; letter-spacing:1.5px; font-weight:600; }
  .home-greeting { margin-top:3px; font-family:"Songti SC","Noto Serif CJK SC",serif; font-size:19px; line-height:1.35; letter-spacing:.5px; color:var(--text-primary); }
  .home-subtitle { margin-top:3px; color:var(--text-muted); font-size:10px; letter-spacing:.4px; }
  .home-hero {
    height:142px; position:relative; overflow:hidden; border-radius:16px; cursor:pointer;
    background:linear-gradient(112deg,#F4E3E1 0%,#EBD5D7 53%,#DCCBD9 100%);
    box-shadow:0 5px 14px rgba(140,59,74,.09);
  }
  .home-hero-copy { position:relative; z-index:2; padding:17px 0 0 15px; }
  .home-hero-label { font-size:7px; letter-spacing:1.4px; color:#986B70; font-weight:600; }
  .home-hero-title { margin-top:5px; font-family:"Songti SC","Noto Serif CJK SC",serif; font-size:20px; color:#633E47; letter-spacing:1px; }
  .home-hero-desc { margin-top:2px; font-size:9px; color:#85666B; }
  .home-hero-link { display:inline-block; margin-top:10px; padding:4px 9px; border:1px solid rgba(140,59,74,.28); border-radius:999px; color:#754650; font-size:8px; }
  .home-hero-link b { margin-left:4px; font-size:11px; }
  .home-hero-art { position:absolute; right:1px; top:0; width:132px; height:142px; }
  .home-hero-art:before { content:""; position:absolute; width:112px; height:112px; right:4px; top:16px; border-radius:50%; background:rgba(255,255,255,.28); }
  .home-hero-art:after { content:""; position:absolute; width:72px; height:72px; right:24px; top:36px; border-radius:50%; border:1px solid rgba(255,255,255,.5); }
  .home-hero-art i, .home-product-art i { position:absolute; display:block; width:15px; height:43px; border-radius:11px 11px 8px 8px; border:1px solid rgba(255,255,255,.82); background:linear-gradient(145deg,#FFF9F3 0%,#E8C5C3 68%,#C98F98 100%); box-shadow:2px 4px 7px rgba(103,63,70,.16); transform:rotate(-19deg); }
  .home-hero-art i:nth-child(1) { right:79px; top:47px; transform:rotate(-30deg); }
  .home-hero-art i:nth-child(2) { right:57px; top:33px; transform:rotate(-12deg); }
  .home-hero-art i:nth-child(3) { right:35px; top:37px; transform:rotate(5deg); }
  .home-hero-art i:nth-child(4) { right:17px; top:53px; transform:rotate(20deg); }
  .home-hero-art i:nth-child(5) { right:43px; top:75px; height:35px; transform:rotate(3deg); }
  .home-hero-no { position:absolute; right:12px; bottom:8px; z-index:2; color:rgba(99,62,71,.62); font-size:7px; letter-spacing:1px; }
  .home-section-head { display:flex; align-items:flex-end; justify-content:space-between; margin:15px 1px 8px; }
  .home-section-head .section-h { margin:0 0 2px; font-size:13px; }
  .home-more { color:var(--text-muted); font-size:9px; cursor:pointer; padding-bottom:2px; }
  .home-more b { color:var(--berry); font-size:11px; margin-left:2px; }
  .home-product-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
  .home-product-card { min-width:0; overflow:hidden; background:var(--white); border:1px solid var(--border); border-radius:13px; box-shadow:var(--card-shadow); cursor:pointer; }
  .home-product-art { height:104px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .home-product-art:before { content:""; position:absolute; width:82px; height:82px; border-radius:50%; background:rgba(255,255,255,.35); }
  .home-product-art.art-cream { background:linear-gradient(145deg,#F4E5DF,#E7C9C7 60%,#D9B5B7); }
  .home-product-art.art-lilac { background:linear-gradient(145deg,#EAE6EF,#D9D6E7 58%,#C7C5D9); }
  .home-product-art i { width:12px; height:38px; z-index:1; }
  .home-product-art i:nth-of-type(1) { margin:0 0 0 -2px; transform:rotate(-23deg) translateY(3px); }
  .home-product-art i:nth-of-type(2) { margin-left:-3px; transform:rotate(-11deg) translateY(-4px); }
  .home-product-art i:nth-of-type(3) { margin-left:-3px; transform:rotate(2deg) translateY(-7px); }
  .home-product-art i:nth-of-type(4) { margin-left:-3px; transform:rotate(15deg) translateY(-3px); }
  .home-product-art i:nth-of-type(5) { margin-left:-3px; transform:rotate(27deg) translateY(4px); }
  .art-lilac i { background:linear-gradient(145deg,#FFFDFE,#DAD8EA 65%,#A8A6C5); }
  .art-chip { position:absolute; z-index:2; top:8px; left:8px; padding:2px 5px; border-radius:999px; background:rgba(255,255,255,.72); color:var(--berry); font-size:7px; letter-spacing:.7px; }
  .home-product-info { padding:8px 8px 9px; }
  .home-product-name { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-size:10px; font-weight:600; color:var(--text-primary); }
  .home-product-tags { margin-top:5px; white-space:nowrap; }
  .home-product-tags .tag { display:inline-block; margin-right:3px; padding:2px 6px; font-size:8px; }
  .home-product-meta { margin-top:6px; gap:2px; }
  .home-product-meta .price { font-size:13px; white-space:nowrap; }
  .home-product-meta .price small { font-size:8px; }
  .home-product-meta .muted { font-size:8px; white-space:nowrap; }
  .home-service { margin-top:12px; padding:9px 8px 8px; border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,.72); text-align:center; }
  .home-service-title { color:var(--text-secondary); font-family:"Songti SC","Noto Serif CJK SC",serif; font-size:9px; letter-spacing:.4px; }
  .home-service-items { display:flex; justify-content:space-around; margin-top:6px; color:var(--text-muted); font-size:8px; }
  .home-service-items b { color:var(--primary-hover); margin-right:3px; font-size:10px; }


  .form-label { font-size:10px; color:var(--text-secondary); margin:2px 0 5px; font-weight:600; }
  .review-stars { color:#D6A34F; font-size:22px; letter-spacing:3px; padding:5px 0; cursor:pointer; }
  .legal-copy { font-size:10px; line-height:1.85; color:var(--text-secondary); }
  .legal-copy h3 { color:var(--text-primary); font-size:11px; margin:12px 0 4px; }
  .legal-copy p { margin:0 0 7px; text-align:justify; }
  .legal-updated { color:var(--text-muted); font-size:9px; padding-bottom:8px; border-bottom:1px solid var(--border); }
  .legal-link { color:var(--berry); font-size:10px; padding:12px 0 4px; cursor:pointer; }

  .section-h { font-size:13px; font-weight:600; margin:2px 0 8px; color:var(--text-primary); }
  .muted { color:var(--text-muted); font-size:11px; }
  .divider { height:1px; background:var(--border); margin:10px 0; }
  .avatar {
    width:34px; height:34px; border-radius:50%; background:var(--tag-bg);
    display:flex; align-items:center; justify-content:center; font-size:11px;
    color:var(--berry); margin-right:10px; flex:0 0 auto;
  }
  .cell {
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 0; font-size:12px; border-bottom:1px solid var(--border-soft); cursor:pointer;
  }
  .cell:last-child { border-bottom:none; }
  .cell .r { color:var(--text-muted); font-size:11px; }
  .badge { font-size:9px; padding:2px 7px; border-radius:999px; margin-left:5px; }
  .badge.pub { background:var(--success-bg); color:var(--success); }
  .badge.own { background:var(--warning-bg); color:var(--warning); }
  .badge.art { background:var(--admin-soft); color:var(--admin-accent); }
  .badge.no { background:var(--danger-bg); color:var(--berry); }
  .sku { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .sku b {
    font-size:11px; font-weight:500; border:1px solid var(--border);
    border-radius:10px; padding:5px 10px; color:var(--text-secondary); cursor:pointer;
  }
  .sku b.on { border-color:var(--primary-hover); color:var(--berry); background:var(--tag-bg); }
  .sku b.other { border-style:dashed; color:var(--warning); }
  .note {
    background:var(--warning-bg-soft); border:1px dashed var(--warning);
    border-radius:10px; padding:9px; font-size:11px;
    color:var(--warning-text); margin-top:8px;
  }
  .footerbar {
    background:var(--white); padding:10px 12px; display:flex; gap:8px;
    align-items:center; flex:0 0 auto; border-top:1px solid var(--border);
  }
  .footerbar .btn { flex:1; margin-top:0; }
  .stat { display:flex; gap:8px; }
  .stat div {
    flex:1; background:var(--white); border:1px solid var(--border);
    border-radius:12px; padding:10px 8px; text-align:center;
  }
  .stat b { display:block; font-size:16px; color:var(--text-primary); font-weight:700; }
  .stat small { font-size:9px; color:var(--text-muted); }
  .stepitem { display:flex; margin-bottom:10px; }
  .stepno {
    width:20px; height:20px; border-radius:50%; background:var(--admin-accent);
    color:var(--white); font-size:10px; display:flex; align-items:center;
    justify-content:center; margin-right:8px; flex:0 0 auto;
  }
  .stepimg { display:flex; gap:4px; margin-top:5px; }
  .stepimg i {
    width:40px; height:40px; background:var(--input-bg); border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-size:8px;
    color:var(--text-muted); font-style:normal;
  }
  .stepimg i.vid { background:var(--admin-soft); color:var(--admin-accent); }
  .perm-note {
    font-size:9px; color:var(--berry); background:var(--danger-bg);
    border-radius:8px; padding:6px 8px; margin-top:6px; line-height:1.5;
  }
  .role-banner {
    background:var(--admin-soft); color:var(--admin-accent); font-size:10px;
    padding:7px 10px; border-radius:10px; margin-bottom:8px;
  }
  .checkbox {
    width:16px; height:16px; border:1.5px solid var(--primary-hover);
    border-radius:5px; display:inline-flex; align-items:center; justify-content:center;
    font-size:10px; color:var(--berry); margin-right:9px; flex:0 0 auto;
  }
  .stepper { display:flex; align-items:center; gap:0; }
  .stepper span {
    width:22px; height:22px; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:13px;
    color:var(--text-secondary); cursor:pointer; border-radius:7px;
  }
  .stepper em { font-style:normal; padding:0 9px; font-size:12px; }
  .timeline { position:relative; padding-left:16px; }
  .timeline::before { content:""; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:var(--border); }
  .tl-item { position:relative; margin-bottom:12px; font-size:11px; }
  .tl-item::before { content:""; position:absolute; left:-15px; top:3px; width:8px; height:8px; border-radius:50%; background:var(--success); }
  .tl-item.pending::before { background:var(--disabled-bg); }
  .tl-item b { display:block; font-size:11px; color:var(--text-primary); }
  .radio { width:16px; height:16px; border-radius:50%; border:1.5px solid var(--disabled-bg); margin-right:9px; flex:0 0 auto; }
  .radio.on { border:5px solid var(--berry); }

  @media (max-width:640px) {
    body { padding:12px 10px 28px; }
    .stage { gap:18px; }
    .nav { margin-bottom:12px; }
  }

.field-label{display:block;margin:9px 0 5px;color:var(--text-secondary);font-size:10px;font-weight:600}
.field-input,.field-select,.field-textarea{width:100%;border:1px solid var(--border);border-radius:9px;background:var(--input-bg);color:var(--text-primary);padding:9px 10px;font:inherit;outline:none}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--primary-hover);background:#fff}
.field-textarea{min-height:72px;resize:vertical;line-height:1.6}
.action-row{display:flex;gap:7px;align-items:center;margin-top:9px}
.action-row>*{flex:1}
.mini-btn{border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--text-secondary);padding:6px 9px;font:inherit;font-size:10px;text-align:center;cursor:pointer}
.mini-btn.primary{background:var(--berry);color:#fff;border-color:var(--berry)}
.mini-btn.danger{color:#A44B55;border-color:#EBD4D5;background:#FFF8F8}
.mini-btn.selected{background:var(--tag-bg);color:var(--berry);border-color:var(--primary)}
.empty-state{padding:28px 12px;text-align:center;color:var(--text-muted);background:#fff;border:1px dashed var(--border);border-radius:13px}
.empty-state b{display:block;color:var(--text-secondary);font-size:12px;margin-bottom:4px}
.check-line{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--text-secondary);margin-top:9px}
.check-line input{accent-color:var(--berry)}
.upload-box{display:flex;flex-wrap:wrap;gap:7px;align-items:center}

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function phoneMask(v){v=String(v||"");return v.length===11?v.slice(0,3)+"****"+v.slice(7):v;}
function beginAddressEdit(id){
  const a=demoState.addresses.find(x=>x.id===id);
  demoState.addressDraft=a?{...a}:{id:null,name:"",phone:"",region:"",detail:"",isDefault:demoState.addresses.length===0};
  go("addressEdit");
}
function saveAddress(){
  const d=demoState.addressDraft;
  if(!d)return;
  d.name=document.getElementById("addrName")?.value||"";
  d.phone=document.getElementById("addrPhone")?.value||"";
  d.region=document.getElementById("addrRegion")?.value||"";
  d.detail=document.getElementById("addrDetail")?.value||"";
  d.isDefault=!!document.getElementById("addrDefault")?.checked;
  if(!d.name.trim()||!/^1\d{10}$/.test(d.phone.replace(/\s/g,""))||!d.region.trim()||!d.detail.trim()){alert("请完整填写收货人、正确手机号、所在地区和详细地址。");return;}
  d.phone=d.phone.replace(/\s/g,"");
  if(d.id){const i=demoState.addresses.findIndex(x=>x.id===d.id);if(i>=0)demoState.addresses[i]={...d};}
  else{d.id=Math.max(0,...demoState.addresses.map(x=>x.id))+1;demoState.addresses.push({...d});}
  if(d.isDefault)demoState.addresses.forEach(x=>x.isDefault=x.id===d.id);
  if(d.id&&demoState.addresses.length===1)demoState.addresses[0].isDefault=true;
  demoState.addressDraft=null;go("addresses");
}
function setDefaultAddress(id){demoState.addresses.forEach(x=>x.isDefault=x.id===id);render();}
function deleteAddress(id){
  if(!confirm("确定删除这条收货地址吗？"))return;
  demoState.addresses=demoState.addresses.filter(x=>x.id!==id);
  if(!demoState.addresses.some(x=>x.isDefault)&&demoState.addresses.length)demoState.addresses[0].isDefault=true;
  render();
}
function removeFavorite(id){demoState.favorites=demoState.favorites.filter(x=>x.id!==id);render();}
function toggleFavorite(id){
  const p=demoState.products.find(x=>x.id===id);if(!p)return;
  const i=demoState.favorites.findIndex(x=>x.id===id);
  if(i>=0)demoState.favorites.splice(i,1);
  else demoState.favorites.push({id:p.id,name:p.name,price:p.price,shape:p.shape,tags:[p.category.split("/")[0].trim(),p.shape],color:"blush"});
  alert(i>=0?"已取消收藏":"已加入收藏");render();
}
function setReviewRating(n){demoState.review.rating=n;render();}
function updateReviewContent(v){demoState.review.content=v;}
function addReviewFiles(input){
  const files=Array.from(input.files||[]).filter(f=>f.type.startsWith("image/"));
  files.slice(0,Math.max(0,9-demoState.review.media.length)).forEach(f=>demoState.review.media.push({name:f.name,url:URL.createObjectURL(f)}));
  render();
}
function removeReviewFile(i){const m=demoState.review.media[i];if(m)URL.revokeObjectURL(m.url);demoState.review.media.splice(i,1);render();}
function submitReview(){
  if(!demoState.review.rating){alert("请选择评分");return;}
  if(!demoState.review.content.trim()){alert("请填写评价内容");return;}
  alert("评价提交成功！（当前为原型演示，未连接后台）");
  demoState.review={rating:5,content:"",media:[]};go("orders");
}
function setProductFilter(v){demoState.productFilter=v;render();}
function setProductKeyword(v){demoState.productKeyword=v;const el=document.getElementById("productCards");if(el)el.innerHTML=renderProductCards();}
function toggleProductStatus(id){const p=demoState.products.find(x=>x.id===id);if(p){p.status=p.status==="在售"?"已下架":"在售";render();}}
function beginProductEdit(id){
  const p=demoState.products.find(x=>x.id===id);
  demoState.productDraft=p?{...p}:{id:null,name:"",price:"",category:"",shape:"短圆",sizes:"S / M / L",stock:0,description:"",status:"草稿",image:""};
  go("productEdit");
}
function updateProductDraft(k,v){if(demoState.productDraft)demoState.productDraft[k]=v;}
function addProductImage(input){
  const f=input.files&&input.files[0];if(!f)return;
  if(!f.type.startsWith("image/")){alert("请选择图片文件");return;}
  if(demoState.productDraft.image&&demoState.productDraft.image.startsWith("blob:"))URL.revokeObjectURL(demoState.productDraft.image);
  demoState.productDraft.image=URL.createObjectURL(f);render();
}
function saveProduct(){
  const d=demoState.productDraft;if(!d)return;
  if(!d.name.trim()||!d.category.trim()||Number(d.price)<=0||d.stock===""||Number(d.stock)<0){alert("请填写商品名称、分类、有效售价和库存。");return;}
  d.price=Number(d.price);d.stock=Math.floor(Number(d.stock));
  if(d.id){const i=demoState.products.findIndex(x=>x.id===d.id);if(i>=0)demoState.products[i]={...d};}
  else{d.id=Math.max(0,...demoState.products.map(x=>x.id))+1;demoState.products.unshift({...d});}
  demoState.productDraft=null;go("adminProducts");
}
function setArchiveFilter(v){demoState.archiveFilter=v;render();}
function setArchiveKeyword(v){demoState.archiveKeyword=v;const el=document.getElementById("archiveCards");if(el)el.innerHTML=renderArchiveCards();}

function renderAddresses(){
  if(!demoState.addresses.length)return `<div class="pad"><div class="empty-state"><b>还没有收货地址</b>添加地址后，下单时就能快速选择</div><div class="btn" onclick="beginAddressEdit(null)">＋ 新增收货地址</div></div>`;
  return `<div class="pad">${demoState.addresses.map(a=>`<div class="card"><div class="row between"><b>${esc(a.name)} <span class="muted" style="font-weight:400">${phoneMask(esc(a.phone))}</span></b>${a.isDefault?'<span class="tag">默认地址</span>':'<span class="tag gray">收货地址</span>'}</div><div style="margin-top:7px;font-size:11px">${esc(a.region)} ${esc(a.detail)}</div><div class="action-row"><button class="mini-btn ${a.isDefault?'selected':''}" onclick="setDefaultAddress(${a.id})">${a.isDefault?'✓ 默认地址':'设为默认'}</button><button class="mini-btn" onclick="beginAddressEdit(${a.id})">编辑</button><button class="mini-btn danger" onclick="deleteAddress(${a.id})">删除</button></div></div>`).join("")}<div class="btn" onclick="beginAddressEdit(null)">＋ 新增收货地址</div><div class="inline-hint">默认地址会优先用于订单确认。</div></div>`;
}
function renderAddressEdit(){
  const d=demoState.addressDraft||{id:null,name:"",phone:"",region:"",detail:"",isDefault:false};
  return `<div class="pad"><div class="card"><label class="field-label">收货人</label><input id="addrName" class="field-input" value="${esc(d.name)}" placeholder="请输入收货人姓名"><label class="field-label">手机号码</label><input id="addrPhone" class="field-input" inputmode="numeric" maxlength="11" value="${esc(d.phone)}" placeholder="请输入 11 位手机号"><label class="field-label">所在地区</label><input id="addrRegion" class="field-input" value="${esc(d.region)}" placeholder="例如：福建省 福州市 鼓楼区"><label class="field-label">详细地址</label><textarea id="addrDetail" class="field-textarea" placeholder="街道、门牌号等">${esc(d.detail)}</textarea><label class="check-line"><input id="addrDefault" type="checkbox" ${d.isDefault?'checked':''}> 设为默认地址</label></div><div class="btn" onclick="saveAddress()">保存地址</div><div class="btn outline" onclick="go('addresses')">取消</div></div>`;
}
function renderFavorites(){
  if(!demoState.favorites.length)return `<div class="pad"><div class="empty-state"><b>还没有收藏商品</b>喜欢的款式可以收藏起来，方便下次查看</div><div class="btn" onclick="go('list')">去逛逛</div></div>`;
  return `<div class="pad"><div class="muted" style="margin:2px 0 10px">已收藏 ${demoState.favorites.length} 款穿戴甲</div>${demoState.favorites.map(f=>`<div class="card"><div class="row"><div class="thumb sm" style="background:${f.color==='lilac'?'linear-gradient(135deg,var(--thumb-lavender-1),var(--thumb-lavender-2))':'linear-gradient(135deg,var(--thumb-blush-1),var(--thumb-blush-2))'}">商品图</div><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600">${esc(f.name)}</div><div style="margin-top:5px">${f.tags.map(t=>`<span class="tag gray">${esc(t)}</span>`).join("")}</div><div class="row between" style="margin-top:6px"><span class="price">¥${Number(f.price).toFixed(0)}<small>/副</small></span><span class="muted">收藏中</span></div></div></div><div class="action-row"><button class="mini-btn" onclick="go('detail')">查看商品</button><button class="mini-btn danger" onclick="removeFavorite(${f.id})">取消收藏</button></div></div>`).join("")}</div>`;
}
function renderReviewPublish(){
  const r=demoState.review;
  return `<div class="pad"><div class="card"><div class="row"><div class="thumb sm">商品图</div><div><div style="font-size:12px;font-weight:600">碎钻渐变长梯</div><div class="muted">订单 #20261108-12</div></div></div></div><div class="card"><div class="section-h">商品满意度</div><div class="stars-control">${[1,2,3,4,5].map(n=>`<button class="${n<=r.rating?'active':''}" onclick="setReviewRating(${n})">★</button>`).join("")}</div><div class="muted">${r.rating} 星 · ${["","非常不满意","不太满意","一般","满意","非常满意"][r.rating]}</div><label class="field-label">评价内容</label><textarea class="field-textarea" maxlength="500" placeholder="分享款式、尺寸和佩戴体验（最多 500 字）" oninput="updateReviewContent(this.value)">${esc(r.content)}</textarea><div class="inline-hint">${r.content.length}/500 字</div><label class="field-label">上传实拍图片（最多 9 张）</label><div class="upload-box">${r.media.map((m,i)=>`<div class="upload-tile"><img src="${m.url}" alt="${esc(m.name)}"></div><button class="mini-btn danger" style="flex:0 0 auto" onclick="removeReviewFile(${i})">删除</button>`).join("")}<label class="upload-tile" style="cursor:pointer">＋图片<input type="file" accept="image/*" multiple hidden onchange="addReviewFiles(this)"></label></div><div class="inline-hint">图片仅在当前浏览器会话预览，正式版需接入上传接口。</div></div><div class="btn" onclick="submitReview()">提交评价</div><div class="btn outline" onclick="go('orders')">暂不评价</div></div>`;
}
function renderProductCards(){
  const list=demoState.products.filter(p=>(demoState.productFilter==="全部"||p.status===demoState.productFilter)&&(!demoState.productKeyword||p.name.toLowerCase().includes(demoState.productKeyword.toLowerCase())));
  if(!list.length)return `<div class="empty-state"><b>没有找到商品</b>试试其他关键词或筛选条件</div>`;
  return list.map(p=>`<div class="card"><div class="row"><div class="thumb sm">${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;border-radius:9px">`:'商品图'}</div><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600">${esc(p.name)}</div><div class="muted">SKU：${esc(p.shape)} / ${esc(p.sizes)} · 库存 ${p.stock}</div><div class="row between" style="margin-top:5px"><span class="price">¥${Number(p.price).toFixed(2)}</span><span class="status-pill ${p.status==='草稿'?'draft':p.status==='已下架'?'off':''}">${p.status}</span></div></div></div><div class="action-row"><button class="mini-btn" onclick="beginProductEdit(${p.id})">编辑</button><button class="mini-btn ${p.status==='在售'?'danger':'primary'}" onclick="toggleProductStatus(${p.id})">${p.status==='在售'?'下架':p.status==='草稿'?'发布':'重新上架'}</button></div></div>`).join("");
}
function renderAdminProducts(){
  return `<div class="pad"><div class="row between" style="margin-bottom:9px"><span class="muted">商品共 ${demoState.products.length} 件 · 在售 ${demoState.products.filter(p=>p.status==='在售').length} 件</span><button class="mini-btn primary" onclick="beginProductEdit(null)">＋ 新增商品</button></div><input class="field-input" style="background:#fff" placeholder="搜索商品名称" value="${esc(demoState.productKeyword)}" oninput="setProductKeyword(this.value)"><div class="cat cat-scroll">${["全部","在售","草稿","已下架"].map(x=>`<span class="${demoState.productFilter===x?'active':''}" onclick="setProductFilter('${x}')">${x}</span>`).join("")}</div><div id="productCards" style="margin-top:10px">${renderProductCards()}</div></div>`;
}
function renderProductEdit(){
  const d=demoState.productDraft||{id:null,name:"",price:"",category:"",shape:"短圆",sizes:"S / M / L",stock:0,description:"",status:"草稿",image:""};
  return `<div class="pad"><div class="role-banner">商品基础信息 · 规格库存 · 售卖状态</div><div class="card"><label class="field-label">商品名称</label><input class="field-input" value="${esc(d.name)}" oninput="updateProductDraft('name',this.value)" placeholder="请输入商品名称"><label class="field-label">商品主图</label><div class="upload-box">${d.image?`<div class="upload-tile"><img src="${d.image}" alt="商品主图"></div>`:''}<label class="upload-tile" style="cursor:pointer">＋上传<input type="file" accept="image/*" hidden onchange="addProductImage(this)"></label></div><label class="field-label">售价（元 / 副）</label><input class="field-input" type="number" min="0.01" step="0.01" value="${esc(d.price)}" oninput="updateProductDraft('price',this.value)" placeholder="请输入售价"><label class="field-label">商品分类</label><input class="field-input" value="${esc(d.category)}" oninput="updateProductDraft('category',this.value)" placeholder="例如：法式 / 猫眼"><label class="field-label">甲型</label><select class="field-select" onchange="updateProductDraft('shape',this.value)">${["短圆","方圆","中长","长梯","尖形"].map(x=>`<option ${d.shape===x?'selected':''}>${x}</option>`).join("")}</select><label class="field-label">尺码规格</label><input class="field-input" value="${esc(d.sizes)}" oninput="updateProductDraft('sizes',this.value)" placeholder="例如：S / M / L"><label class="field-label">库存</label><input class="field-input" type="number" min="0" step="1" value="${esc(d.stock)}" oninput="updateProductDraft('stock',this.value)" placeholder="请输入库存"><label class="field-label">商品描述</label><textarea class="field-textarea" oninput="updateProductDraft('description',this.value)" placeholder="介绍款式特点、材质与佩戴建议">${esc(d.description)}</textarea><label class="field-label">商品状态</label><select class="field-select" onchange="updateProductDraft('status',this.value)">${["草稿","在售","已下架"].map(x=>`<option ${d.status===x?'selected':''}>${x}</option>`).join("")}</select></div><div class="btn admin" onclick="saveProduct()">保存商品</div><div class="btn outline" onclick="demoState.productDraft=null;go('adminProducts')">取消</div></div>`;
}
const archiveEntries=[
  {id:"NA-001",name:"奶油法式猫眼",version:"V2",status:"已发布",steps:2,updated:"2026-11-08",type:"短圆 · 猫眼"},
  {id:"NA-002",name:"碎钻渐变长梯",version:"V1",status:"已发布",steps:3,updated:"2026-11-06",type:"长梯 · 渐变"},
  {id:"NA-003",name:"豆沙裸粉方圆",version:"V1",status:"草稿",steps:4,updated:"2026-11-04",type:"方圆 · 裸粉"}
];
function renderArchiveCards(){
  const list=archiveEntries.filter(x=>(demoState.archiveFilter==="全部"||x.status===demoState.archiveFilter)&&(!demoState.archiveKeyword||(x.name+x.id+x.type).toLowerCase().includes(demoState.archiveKeyword.toLowerCase())));
  if(!list.length)return `<div class="empty-state"><b>没有匹配的制作资料</b>修改关键词或筛选条件试试</div>`;
  return list.map(x=>`<div class="card"><div class="row"><div class="thumb sm">资料图</div><div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:600">${x.name}</div><div class="muted">编号：${x.id} · ${x.version} · ${x.type}</div><div style="margin-top:5px"><span class="status-pill ${x.status==='草稿'?'draft':''}">${x.status}</span><span class="tag gray">${x.steps} 个制作步骤</span></div></div></div><div class="row between" style="margin-top:8px"><span class="muted">最近更新：${x.updated}</span><button class="mini-btn" style="flex:0 0 auto" onclick="go('archiveRead')">查看资料 ›</button></div></div>`).join("");
}
function renderArchiveList(){
  return `<div class="pad"><div class="role-banner">美甲师账号仅查看已授权制作资料；成本、售价策略等私有字段不下发</div><input class="field-input" placeholder="搜索商品名称 / 资料编号" value="${esc(demoState.archiveKeyword)}" oninput="setArchiveKeyword(this.value)"><div class="cat cat-scroll">${["全部","已发布","草稿"].map(x=>`<span class="${demoState.archiveFilter===x?'active':''}" onclick="setArchiveFilter('${x}')">${x}</span>`).join("")}</div><div id="archiveCards" style="margin-top:10px">${renderArchiveCards()}</div></div>`;
}
function getPageHtml(key){
  const views={addresses:renderAddresses,addressEdit:renderAddressEdit,favorites:renderFavorites,reviewPublish:renderReviewPublish,adminProducts:renderAdminProducts,productEdit:renderProductEdit,archiveList:renderArchiveList};
  return views[key]?views[key]():PAGES[key].html;
}

/* ================== 渲染逻辑 ================== */
const NAV_ORDER = [
  ["home","首页"],["list","搜索列表"],["detail","商品详情"],["cart","购物车"],
  ["order","确认订单"],["orders","我的订单"],["orderDetail","订单详情"],["afterSale","售后协商"],
  ["user","我的"],["addresses","地址管理"],["addressEdit","编辑地址"],["favorites","我的收藏"],
  ["reviewPublish","发表评价"],["agreement","用户协议"],["privacy","隐私政策"],
  ["adminLogin","管理登录"],["adminHome","管理后台"],["adminProducts","商品管理"],["productEdit","商品编辑"],
  ["archiveList","制作资料列表"],["archiveEdit","档案编辑"],["archiveRead","档案只读"],
  ["adminAccounts","账号与码"],["adminOrders","订单管理"],["adminReview","评价规则"]
];

let current = "home";
const stage = document.getElementById("stage");
const navBar = document.getElementById("navBar");

function isAdminPage(key){ return key.startsWith("admin") || ["productEdit","archiveList","archiveEdit","archiveRead"].includes(key); }

function renderNav(){
  navBar.innerHTML = NAV_ORDER.map(([k,label])=>{
    const cls = (k===current?"on ":"") + (isAdminPage(k)?"admin":"");
    return `<button class="${cls}" onclick="go('${k}')">${label}</button>`;
  }).join("");
}

function renderTabs(tab, on){
  if(!tab) return "";
  const icons=["⌂","▤","🛒","☺"], names=["首页","分类","购物车","我的"];
  return `<div class="tabbar">` + tab.map((_,i)=>{
    const onCls = i===on?"on":"";
    const target = ["home","list","cart","user"][i];
    return `<div class="${onCls}" onclick="go('${target}')"><span class="ico">${icons[i]}</span>${names[i]}</div>`;
  }).join("") + `</div>`;
}

function render(){
  const p = PAGES[current];
  if(!p) return;
  const tabOn = p.tabOn !== undefined ? p.tabOn : -1;
  stage.innerHTML = `
    <div class="phone">
      <div class="statusbar"><span>9:41</span><span>●●● ⚡</span></div>
      <div class="navbar">
        ${p.role==="管理端"?'<span class="back" onclick="go(\'adminHome\')">‹</span>':''}
        ${p.title}
      </div>
      <div class="body">${getPageHtml(current)}</div>
      ${p.footer?`<div class="footerbar">${p.footer}</div>`:""}
      ${p.tab?renderTabs(p.tab, tabOn):""}
    </div>
  `;
  renderNav();
}

function go(key){
  if(!PAGES[key]) return;
  current = key;
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* 初始化 */
render();
</script>
